<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, #map { margin: 0; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Max zoom set to 18 so it physically stops before turning white
    const map = L.map("map", { maxZoom: 18 }).setView([38.9632, -76.7417], 16);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png?key={{ key }}", {
      maxZoom: 18,
      subdomains: "abcd"
    }).addTo(map);

    navigator.geolocation?.getCurrentPosition(pos => {
      map.setView([pos.coords.latitude, pos.coords.longitude], 17);
      L.circleMarker([pos.coords.latitude, pos.coords.longitude], { radius: 8, color: "#33b5f5" }).addTo(map);
    });
  </script>
</body>
</html>
